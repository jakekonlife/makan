<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>附近今天吃什么</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm paper column; a single accent colour is reserved for the pick and the main button. */
:root{
  color-scheme: light;
  --paper:#f7f0df; --card:#fffaf0; --sand:#f0dfb8;
  --ink:#0f3d4a; --muted:#5b777d; --line:rgba(15,61,74,.18);
  --accent:#e8553a;
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.scene{display:block;width:calc(100% + 32px);margin:0 -16px;height:auto;max-width:none}
@media (min-width:512px){.scene{width:100%;margin:16px 0 0}}

.head{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:0;letter-spacing:2px}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1.5px solid var(--ink);padding:9px 11px;font:inherit;background:var(--card);color:var(--ink);border-radius:0}
.search input::placeholder{color:var(--muted)}
.search button{border:1.5px solid var(--ink);background:var(--ink);color:var(--card);font-weight:700;padding:0 14px;white-space:nowrap}
.search .gps{background:none;color:var(--ink);padding:0 11px;display:flex;align-items:center;gap:4px}
.search .gps svg{width:16px;height:16px}
.loc{margin:0;font-size:13px;color:var(--muted);min-width:0}
.loc b{color:var(--ink);font-weight:700;margin-right:6px}

.result{background:var(--card);border:1.5px solid var(--ink);display:flex;flex-direction:column}
.photo{position:relative;background:var(--ink);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo.noimg{aspect-ratio:auto;height:120px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ico{width:120px}
.photo .ico svg{width:100%;height:auto;display:block}
.ph-link{display:block;width:100%;height:100%;position:relative}
.more{position:absolute;left:8px;top:8px;background:rgba(15,61,74,.8);color:#fffaf0;font-size:12px;font-weight:700;padding:3px 9px}
.credit{position:absolute;right:0;bottom:0;background:rgba(15,61,74,.75);color:#fffaf0;font-size:10.5px;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:inherit}
.thumbs{display:flex;gap:4px;padding:4px 4px 0}
.thumbs:empty{display:none}
.thumbs button{flex:0 0 72px;height:54px;border:0;padding:0;background:var(--sand);overflow:hidden;opacity:.6}
.thumbs button[aria-pressed="true"]{opacity:1;outline:2px solid var(--accent);outline-offset:-2px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pick{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.pick h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.dish{font-size:14px;margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:1px 8px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tag.on{border-color:#2f7d4f;color:#2f7d4f}
.tag.off{border-color:var(--accent);color:var(--accent)}
.tag.occ{background:var(--sand);border-color:var(--sand)}
.hours{font-size:12.5px;margin:0;color:var(--muted)}
.hours details summary{cursor:pointer;list-style:none;text-decoration:underline;text-underline-offset:3px}
.hours details summary::-webkit-details-marker{display:none}
.hours ul{margin:4px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.spinning h2{color:var(--accent)}
.gone{align-self:flex-start;border:0;background:none;padding:2px 0 0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.gone[hidden]{display:none}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions > *{border:1.5px solid var(--ink);background:none;padding:10px 6px;text-align:center;text-decoration:none;font-weight:700;font-size:14px;display:block}
.actions > a:not([href]){opacity:.35;pointer-events:none}
.actions > .go{grid-column:1 / -1;background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:3px;padding:12px 8px}
.go:active{transform:translateY(1px)}
.status{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.status:empty{display:none}

.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:baseline}
.row[hidden]{display:none}
.row > span{flex:0 0 2.6em;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;padding:2px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:500}

details.fold{border-top:1px solid var(--line)}
details.fold.first{border-top:1.5px solid var(--ink)}
details.fold.last{border-bottom:1.5px solid var(--ink)}
.fold + .fold{margin-top:-16px}
.fold > summary{cursor:pointer;padding:12px 0;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"展开";font-size:12.5px;font-weight:400;color:var(--muted)}
.fold[open] > summary::after{content:"收起"}
.fold > summary span{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px;margin-right:auto}
.hint{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.sortbar{display:flex;gap:6px;align-items:baseline;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
ol{list-style:none;margin:0 0 8px;padding:0}
li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 6px;border-top:1px solid var(--line)}
li strong{display:block;font-size:14px;line-height:1.35;font-weight:500;overflow-wrap:anywhere}
li small{display:block;font-size:12px;color:var(--muted)}
li a{font-size:12.5px;white-space:nowrap;color:var(--muted)}
li.off{opacity:.4}
.keybox{display:flex;flex-direction:column;gap:8px;padding:0 0 14px;font-size:13px}
.keybox p{margin:0;color:var(--muted)}
.keybox ol{list-style:decimal;padding-left:20px;margin:0;color:var(--muted)}
.keybox ol li{display:list-item;border:0;padding:0}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0;border:1px solid var(--line);padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.keyrow button{border:1.5px solid var(--ink);background:none;font-weight:700;padding:6px 12px}
.lock{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.lock[hidden]{display:none}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lockbox p{margin:0;color:var(--muted);font-size:14px}
.lockbox form{display:flex;gap:6px}
.lockbox input{flex:1;min-width:0;border:1.5px solid var(--ink);padding:10px 12px;font:inherit;background:var(--card);color:var(--ink);border-radius:0}
.lockbox button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;padding:0 18px}
.lockbox .lockmsg{color:var(--accent);min-height:1.4em}
.foot{font-size:11.5px;color:var(--muted);margin:0}
@media (max-width:380px){h1{font-size:34px}.pick h2{font-size:24px}.actions > *{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.photo .ico svg{transition:transform .25s}.spinning .photo .ico svg{transform:rotate(-8deg) scale(.94)}}

/* wheel version additions */
.step{display:flex;flex-direction:column;gap:10px}
.step-h{display:flex;align-items:baseline;gap:8px;margin:0;font-size:13px;color:var(--muted);font-weight:500}
.step-h b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);letter-spacing:1px}
.wheel-wrap{position:relative;width:min(100%,320px);aspect-ratio:1/1;margin:4px auto 0}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--accent);filter:drop-shadow(0 2px 0 rgba(15,61,74,.25));z-index:2}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-family:var(--display);font-size:24px;letter-spacing:2px;box-shadow:0 0 0 5px var(--card),0 0 0 6.5px var(--ink);z-index:2}
.hub:disabled{opacity:.85}
.verdict{text-align:center;margin:0;min-height:1.6em;font-size:14px;color:var(--muted)}
.verdict b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink);letter-spacing:2px;display:block;line-height:1.2}
.result.idle .pick h2{font-size:22px;color:var(--muted)}
.step + .step .actions, .actions{grid-template-columns:1fr 1fr}
.edit-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.edit-list span{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);font-size:13px;padding:2px 2px 2px 10px}
.edit-list button{border:0;background:none;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
.edit-add{display:flex;gap:6px;padding:0 0 8px}
.edit-add input{flex:1;min-width:0;border:1px solid var(--line);padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.edit-add button,.edit-reset{border:1.5px solid var(--ink);background:none;font-weight:700;padding:6px 12px}
.edit-reset{margin:0 0 14px;font-weight:500;font-size:13px}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="lockbox">
    <h1>今天吃什么</h1>
    <p>这个页面需要通行码才能使用。</p>
    <form id="lock-form" autocomplete="off">
      <input id="lock-pw" type="password" placeholder="输入通行码" aria-label="通行码" autocomplete="current-password">
      <button type="submit" id="lock-go">解锁</button>
    </form>
    <p class="lockmsg" id="lock-msg" aria-live="polite"></p>

</div>
<main class="wrap">

<header class="head">
  <h1>今天吃什么</h1>
  <div class="search">
    <input id="place" type="search" enterkeyhint="search" placeholder="输入地点，例如 Sri Petaling" aria-label="输入地点">
    <button type="button" id="manual-go">用这里</button>
    <button type="button" class="gps" id="relocate" aria-label="用我现在的位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>定位</button>
  </div>
  <p class="loc"><b id="where">正在定位…</b><span id="where2">请在浏览器弹窗里允许使用位置</span></p>
</header>

<section class="step" aria-labelledby="s1">
  <p class="step-h" id="s1"><b>① 吃什么</b>选场合，转一下</p>
  <div class="chips" id="f-occ"></div>
  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="640" height="640" role="img" aria-label="食物轮盘"></canvas>
    <button type="button" class="hub" id="spin">转</button>
  </div>
  <p class="verdict" id="verdict" aria-live="polite">点中间的「转」，看今天吃什么</p>
</section>

<section class="step" aria-labelledby="s2">
  <p class="step-h" id="s2"><b>② 去哪吃</b><span id="s2-sub">转到之后，这里会推荐附近的店</span></p>
  <section class="result idle" id="result" aria-live="polite">
    <div class="photo noimg" id="photo"></div>
    <div class="pick">
      <div class="eyebrow" id="eyebrow">推荐这家</div>
      <h2 id="r-name">先转轮盘</h2>
      <p class="dish" id="r-dish"></p>
      <div class="meta" id="r-meta"></div>
      <div class="hours" id="r-hours"></div>
    </div>
  </section>
  <div class="actions">
    <button class="go" id="next" type="button">换一家</button>
    <a id="menu" target="_blank" rel="noopener">菜单·照片</a>
    <a id="nav" target="_blank" rel="noopener">带我去</a>
  </div>
  <p class="status" id="status"></p>
  <section class="filters" aria-label="筛选">
    <div class="row"><span>范围</span><div class="chips" id="f-radius"></div></div>
    <div class="row"><span>条件</span><div class="chips" id="f-cond"></div></div>
  </section>
</section>

<details class="fold first" id="listfold">
  <summary><span id="list-title">附近的店</span><span id="count"></span></summary>
  <div class="sortbar">排序 <div class="chips" id="f-sort"></div></div>
  <p class="hint">点店名直接选它，点距离打开导航。</p>
  <ol id="list"></ol>
</details>
<details class="fold" id="editfold">
  <summary>编辑轮盘<span id="edit-occ"></span></summary>
  <div class="edit-list" id="edit-list"></div>
  <div class="edit-add">
    <input id="edit-in" type="text" placeholder="加一样食物，例如 酿豆腐" aria-label="加一样食物">
    <button type="button" id="edit-addbtn">加入</button>
  </div>

<script>
const I = {
'面':'<path d="M30 62h80a40 40 0 0 1-80 0z" fill="#e8553a"/><rect x="30" y="58" width="80" height="7" fill="#fffaf0"/><path d="M40 58q8-11 16 0q8-11 16 0q8-11 16 0q7-9 12 0" fill="none" stroke="#f0dfb8" stroke-width="5"/><path d="M102 22l-40 40M112 28l-42 34" stroke="#7fb3b5" stroke-width="4" stroke-linecap="round"/><rect x="54" y="100" width="32" height="7" fill="#f0dfb8"/><path d="M46 46q4-10 0-18M62 44q4-10 0-18" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>',
'饭':'<ellipse cx="70" cy="82" rx="54" ry="18" fill="#fffaf0"/><ellipse cx="70" cy="80" rx="42" ry="12" fill="#3f7f85"/><path d="M48 78a22 22 0 0 1 44 0z" fill="#fffaf0"/><circle cx="96" cy="74" r="9" fill="#e8553a"/><ellipse cx="42" cy="76" rx="9" ry="6" fill="#f0dfb8"/><circle cx="42" cy="76" r="3" fill="#f0dfb8"/><path d="M60 44q4-10 0-18M78 44q4-10 0-18" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>',
'点心':'<rect x="24" y="78" width="92" height="26" fill="#f0dfb8"/><rect x="24" y="88" width="92" height="5" fill="#7fb3b5"/><rect x="32" y="52" width="76" height="26" fill="#f0dfb8"/><rect x="32" y="62" width="76" height="5" fill="#7fb3b5"/><path d="M38 52a32 20 0 0 1 64 0z" fill="#e8553a"/><circle cx="70" cy="28" r="5" fill="#fffaf0"/>',
'大炒':'<path d="M22 60h86a43 34 0 0 1-86 0z" fill="#7fb3b5"/><rect x="104" y="58" width="30" height="7" fill="#7fb3b5"/><path d="M40 58q6-22 18-8q4-22 16-6q10-18 16 14z" fill="#f0dfb8"/><path d="M52 58q4-10 10-4q4-10 10 4z" fill="#f0dfb8"/><circle cx="46" cy="28" r="5" fill="#fffaf0"/><circle cx="84" cy="22" r="4" fill="#e8553a"/><rect x="50" y="98" width="30" height="7" fill="#e8553a"/>',
'粥煲':'<rect x="30" y="56" width="80" height="44" fill="#f0dfb8"/><rect x="24" y="48" width="92" height="10" fill="#7fb3b5"/><rect x="62" y="38" width="16" height="10" fill="#e8553a"/><rect x="12" y="62" width="18" height="8" fill="#7fb3b5"/><rect x="110" y="62" width="18" height="8" fill="#7fb3b5"/><path d="M30 78h80" stroke="#f0dfb8" stroke-width="5"/><path d="M52 32q4-10 0-18M88 32q4-10 0-18" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>',
'咖啡':'<rect x="36" y="48" width="56" height="50" fill="#fffaf0"/><rect x="36" y="48" width="56" height="12" fill="#e8553a"/><path d="M92 58h10a12 12 0 0 1 0 24h-10" fill="none" stroke="#fffaf0" stroke-width="7"/><rect x="26" y="100" width="76" height="7" fill="#7fb3b5"/><path d="M54 38q4-10 0-18M72 38q4-10 0-18" fill="none" stroke="#f0dfb8" stroke-width="3" stroke-linecap="round"/>'
};
const icon = c => '<div class="ico"><svg viewBox="0 0 140 120" aria-hidden="true">' + I[c] + '</svg></div>';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k){ try { localStorage.removeItem(k); } catch (e) {} } };
let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- wheel content ---------- */
const OCC = {bf:'早午餐', dn:'晚餐', grp:'聚餐', tea:'喝茶'};
// [显示名, Google 搜索词, 图标]
const DEFAULTS = {
  bf: [['椰浆饭','nasi lemak','饭'],['点心','dim sum','点心'],['板面','pan mee','面'],['云吞面','wantan mee','面'],['印度煎饼','roti canai','大炒'],['咖椰吐司','kopitiam kaya toast','咖啡'],['猪肉粉','pork noodle','面'],['粥','porridge','粥煲'],['炒粿条','char kuey teow','大炒'],['咖喱面','curry mee','面'],['鸡饭','chicken rice','饭'],['西式早午餐','brunch cafe','咖啡']],
  dn: [['大炒','tai chow restaurant','大炒'],['火锅','steamboat hot pot','粥煲'],['日本料理','japanese restaurant','面'],['韩国烤肉','korean bbq','大炒'],['肉骨茶','bak kut teh','粥煲'],['海鲜','seafood restaurant','大炒'],['西餐','western food','大炒'],['泰国菜','thai food','饭'],['拉面','ramen','面'],['瓦煲','claypot','粥煲'],['嘛嘛档','mamak','饭'],['烧烤','bbq grill','大炒']],
  grp: [['火锅','steamboat hot pot','粥煲'],['海鲜','seafood restaurant','大炒'],['自助餐','buffet restaurant','饭'],['韩国烤肉','korean bbq','大炒'],['大炒','tai chow restaurant','大炒'],['中餐酒家','chinese restaurant','点心'],['日本料理','japanese restaurant','面'],['牛排西餐','steak house','大炒'],['泰国菜','thai restaurant','饭'],['烤鱼','grilled fish restaurant','大炒']],
  tea: [['奶茶','bubble tea','咖啡'],['咖啡','coffee','咖啡'],['甜品','dessert','咖啡'],['糖水','tong sui dessert','粥煲'],['蛋糕','cake shop','咖啡'],['冰淇淋','ice cream','咖啡'],['华夫饼','waffle','咖啡'],['茶室','kopitiam','咖啡'],['煎蕊','cendol','粥煲'],['手冲咖啡','specialty coffee','咖啡']]
};
const itemsKey = occ => 'wheel-' + occ;
const getItems = occ => store.get(itemsKey(occ)) || DEFAULTS[occ].map(([n, q, i]) => ({n, q, i}));
const setItems = (occ, list) => store.set(itemsKey(occ), list);

/* ---------- state ---------- */
const hr0 = new Date().getHours();
const state = { req:0, lid:0, pos:null, label:'', radius:1000,
  occ: hr0 >= 14 && hr0 < 17 ? 'tea' : hr0 >= 17 || hr0 < 4 ? 'dn' : 'bf',
  dish:null, places:[], src:'', conds:new Set(), sort:'near', seen:[], cur:null, busy:false };
let KEY = store.get('gkey') || '';

function dist(a, b){
  const R = 6371000, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lon-a.lon)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD = m => m < 950 ? Math.round(m/10)*10 + ' 米' : (m/1000).toFixed(1) + ' 公里';
function tfetch(url, opt, ms){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 15000);
  return fetch(url, Object.assign({signal:c.signal}, opt || {})).finally(() => clearTimeout(t));
}

/* ---------- wheel drawing ---------- */
const cv = $('wheel'), ctx = cv.getContext('2d');
let rot = 0, spinning = false;
function drawWheel(){
  const items = getItems(state.occ), n = Math.max(items.length, 1), W = cv.width, R = W/2 - 8, c = W/2, seg = 2*Math.PI/n;
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(c, c);
  ctx.beginPath(); ctx.arc(0, 0, R + 6, 0, 2*Math.PI); ctx.fillStyle = '#0f3d4a'; ctx.fill();
  for (let i = 0; i < n; i++){
    const a0 = rot + i*seg, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
    ctx.fillStyle = n % 2 && i === n - 1 && n > 1 ? '#7fb3b5' : (i % 2 ? '#fffaf0' : '#f0dfb8');
    if (state.dishIdx === i && !spinning && state.dish) ctx.fillStyle = '#e8553a';
    ctx.fill(); ctx.strokeStyle = 'rgba(15,61,74,.35)'; ctx.lineWidth = 2; ctx.stroke();
    if (!items[i]) continue;
    const mid = a0 + seg/2, flip = Math.cos(mid) < 0;
    ctx.save(); ctx.rotate(flip ? mid + Math.PI : mid);
    const fs = Math.max(20, Math.min(34, 300 / Math.max(n, 6)));
    ctx.font = `700 ${fs}px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillStyle = state.dishIdx === i && !spinning && state.dish ? '#ffffff' : '#0f3d4a';
    ctx.textAlign = flip ? 'left' : 'right'; ctx.textBaseline = 'middle';
    let label = items[i].n; while (ctx.measureText(label).width > R - 90 && label.length > 1) label = label.slice(0, -1);
    if (label !== items[i].n) label = label.slice(0, -1) + '…';
    ctx.fillText(label, flip ? -(R - 18) : R - 18, 0);
    ctx.restore();
  }
  ctx.restore();
}
function spin(){
  const items = getItems(state.occ);
  if (spinning || !items.length) return;
  const idx = Math.floor(Math.random()*items.length), seg = 2*Math.PI/items.length;
  // put slice idx under the pointer (top = -PI/2), with a little random offset inside the slice
  const jitter = (Math.random() - .5) * seg * .6;
  let target = -Math.PI/2 - (idx + .5)*seg + jitter;
  const turns = reduceMotion() ? 0 : 6;
  while (target < rot + turns*2*Math.PI) target += 2*Math.PI;
  const start = rot, dur = reduceMotion() ? 0 : 3600, t0 = performance.now();
  spinning = true; $('spin').disabled = true; state.dish = null; drawWheel();
  $('verdict').innerHTML = '转呀转…';
  const step = now => {
    const t = dur ? Math.min(1, (now - t0)/dur) : 1, e = 1 - Math.pow(1 - t, 4);
    rot = start + (target - start)*e; drawWheel();
    if (t < 1) requestAnimationFrame(step);
    else { rot = target % (2*Math.PI); spinning = false; $('spin').disabled = false; chooseDish(idx); }
  };
  requestAnimationFrame(step);
}
function chooseDish(idx){
  const it = getItems(state.occ)[idx]; if (!it) return;
  state.dish = it; state.dishIdx = idx; drawWheel();
  $('verdict').innerHTML = `今天吃<b>${esc(it.n)}</b>`;
  $('s2-sub').textContent = `附近卖「${it.n}」的店`;
  $('list-title').textContent = `附近卖「${it.n}」的店`;
  if (state.pos) load(); else setStatus('先定位或在上面输入地点，才能找附近的店。');
}

/* ---------- chips ---------- */
const COND = {
  open:  {l:'营业中',       f:p => p.open === true,  has:p => p.open !== undefined},
  r4:    {l:'4 分以上',     f:p => p.rating >= 4,    has:p => p.rating != null},
  cheap: {l:'平价',         f:p => p.price != null && p.price <= 1, has:p => p.price != null},
  near:  {l:'走路 5 分钟内', f:p => p.d <= 400,       has:p => p.d <= 400}
};
const F = {
  occ: Object.entries(OCC),
  radius:[[500,'500 米'],[1000,'1 公里'],[2000,'2 公里'],[5000,'5 公里']],
  sort:[['near','最近'],['rating','评分高']]
};
function chips(key){
  if (key === 'cond') {
    const avail = Object.keys(COND).filter(k => state.places.some(COND[k].has));
    [...state.conds].forEach(k => { if (!avail.includes(k)) state.conds.delete(k); });
    $('f-cond').closest('.row').hidden = !avail.length;
    $('f-cond').innerHTML = avail.map(k => `<button type="button" class="chip" data-k="cond" data-v="${k}" aria-pressed="${state.conds.has(k)}">${COND[k].l}</button>`).join('');
    return;
  }
  $('f-'+key).innerHTML = F[key].map(([v,l]) => `<button type="button" class="chip" data-k="${key}" data-v="${v}" aria-pressed="${String(state[key])===String(v)}">${l}</button>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'occ') {
    if (spinning) return;
    state.occ = v; state.dish = null; state.dishIdx = -1; chips('occ'); drawWheel(); renderEdit();
    $('verdict').textContent = '点中间的「转」，看今天吃什么'; resetResult(); return;
  }
  if (k === 'radius') { state.radius = Number(v); chips('radius'); if (state.pos && state.dish) load(); return; }
  if (k === 'cond') { state.conds.has(v) ? state.conds.delete(v) : state.conds.add(v); chips('cond'); state.seen = []; pick(); return; }
  if (k === 'sort') { state.sort = v; chips('sort'); list(); }
});

/* ---------- location ---------- */
function setWhere(a, b){ $('where').textContent = a; $('where2').textContent = b || ''; }
function setStatus(t){ $('status').textContent = t || ''; }
function locate(auto){
  if (!navigator.geolocation) { setWhere('这个浏览器不支持定位', '在上面输入地点也可以'); return; }
  if (!auto) setWhere('正在定位…', '如果浏览器弹出询问，请点允许');
  const lid = ++state.lid; let done = false;
  if (!auto) setTimeout(() => { if (!done && lid === state.lid) { done = true; setWhere('定位没有回应', framed ? '预览窗口不允许定位，请在浏览器里打开' : '浏览器没有给出位置，在上面输入地点也可以'); } }, 15000);
  navigator.geolocation.getCurrentPosition(p => {
    if (done || lid !== state.lid) return; done = true;
    const np = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
    if (auto && state.pos && dist(state.pos, np) < 250) return;
    const moved = auto && state.pos;
    state.pos = np; state.label = ''; $('place').value = '';
    nameArea();
    if (state.dish) load(moved ? '你换地方了，已按新位置重新找。' : '');
  }, err => {
    if (auto || done || lid !== state.lid) return; done = true;
    setWhere(err.code === 1 ? '没有拿到定位权限' : '定位失败', framed ? '预览窗口不允许定位，请在浏览器里打开' : err.code === 1 ? '在浏览器的网站设置里允许位置，或在上面输入地点' : '检查设备的定位服务是否打开，或在上面输入地点');
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:auto ? 60000 : 0});
}
async function manual(){
  const q = $('place').value.trim();
  if (!q) { $('place').focus(); return; }
  state.lid++; setWhere('正在找这个地方…', q); $('place').blur();
  let hit = null;
  try {
    const j = await (await tfetch('https://photon.komoot.io/api/?limit=1&lat=3.1&lon=101.7&q=' + encodeURIComponent(q), {}, 10000)).json();
    const f = (j.features || [])[0]; if (f) hit = {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]};
  } catch (e) {}
  if (!hit) try {
    const j = await (await tfetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh,en&q=' + encodeURIComponent(q), {}, 10000)).json();
    if (j.length) hit = {lat:+j[0].lat, lon:+j[0].lon};
  } catch (e) {}
  if (!hit) { setWhere('找不到这个地点', '换个写法，或加上城市名再试'); return; }
  state.pos = hit; state.label = q; whereLine();
  if (state.dish) load();
}
async function nameArea(){
  if (state.label) return whereLine();
  const {lat, lon} = state.pos;
  try {
    const p = ((await (await tfetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}`, {}, 8000)).json()).features || [])[0]?.properties || {};
    state.label = [p.district || p.locality || p.street, p.city].filter(Boolean).join(' · ');
  } catch (e) {}
  whereLine();
}
function whereLine(){
  if (!state.pos) return;
  const acc = state.pos.acc ? `定位误差约 ${Math.round(state.pos.acc)} 米` : '';
  const found = state.dish && !state.busy && state.places.length ? `${fmtD(state.radius)}内有 ${state.places.length} 家卖「${state.dish.n}」` : '';
  setWhere(state.label || `${state.pos.lat.toFixed(4)}, ${state.pos.lon.toFixed(4)}`, [found, acc].filter(Boolean).join('，'));
}

/* ---------- data: Google Text Search ---------- */
const PRICE = ['免费', '平价', '中等', '偏贵', '很贵'];
const PRICE_KEY = {PRICE_LEVEL_FREE:0, PRICE_LEVEL_INEXPENSIVE:1, PRICE_LEVEL_MODERATE:2, PRICE_LEVEL_EXPENSIVE:3, PRICE_LEVEL_VERY_EXPENSIVE:4};
const GMASK = ['id','displayName','location','rating','userRatingCount','priceLevel','currentOpeningHours.openNow','currentOpeningHours.weekdayDescriptions','regularOpeningHours.weekdayDescriptions','photos','primaryTypeDisplayName','googleMapsUri','shortFormattedAddress','businessStatus'].map(f => 'places.' + f).join(',');
async function google(q){
  const {lat, lon} = state.pos;
  const r = await tfetch('https://places.googleapis.com/v1/places:searchText', {method:'POST', headers:{'Content-Type':'application/json','X-Goog-Api-Key':KEY,'X-Goog-FieldMask':GMASK},
    body:JSON.stringify({textQuery:q, pageSize:20, languageCode:'zh-CN', regionCode:'MY', rankPreference:'DISTANCE', locationBias:{circle:{center:{latitude:lat, longitude:lon}, radius:Math.max(state.radius, 1000)}}})}, 15000);
  if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error((j.error && j.error.message) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return ((await r.json()).places || []).filter(g => g.location && (!g.businessStatus || g.businessStatus === 'OPERATIONAL')).map(g => {
    const name = (g.displayName && g.displayName.text) || '';
    return { id:'g' + g.id, n:name, lat:g.location.latitude, lon:g.location.longitude,
      kind:(g.primaryTypeDisplayName && g.primaryTypeDisplayName.text) || '', street:g.shortFormattedAddress || '',
      rating:g.rating, rc:g.userRatingCount, price:PRICE_KEY[g.priceLevel], open:g.currentOpeningHours ? g.currentOpeningHours.openNow : undefined,
      hrs:(g.currentOpeningHours && g.currentOpeningHours.weekdayDescriptions) || (g.regularOpeningHours && g.regularOpeningHours.weekdayDescriptions) || null,
      photo:(g.photos || [])[0] ? {name:g.photos[0].name, by:(g.photos[0].authorAttributions || [])[0] || null} : null, maps:g.googleMapsUri };
  });
}
const photoUrl = (p, w) => `https://places.googleapis.com/v1/${p.name}/media?maxWidthPx=${w || 800}&key=${encodeURIComponent(KEY)}`;
async function photonSearch(q){
  const {lat, lon} = state.pos;
  const j = await (await tfetch(`https://photon.komoot.io/api/?limit=30&lat=${lat}&lon=${lon}&q=${encodeURIComponent(q)}`, {}, 12000)).json();
  return (j.features || []).filter(f => (f.properties || {}).osm_key === 'amenity').map(f => {
    const p = f.properties, [lo, la] = f.geometry.coordinates;
    return {id:(p.osm_type || 'x').toLowerCase() + p.osm_id, n:p.name, lat:la, lon:lo, kind:p.osm_value, street:[p.housenumber, p.street].filter(Boolean).join(' ')};
  }).filter(p => p.n);
}

/* ---------- load results for the chosen dish ---------- */
const cacheKey = () => `res|${state.dish.q}|${state.pos.lat.toFixed(3)},${state.pos.lon.toFixed(3)}|${state.radius}|${KEY ? 'g' : 'o'}`;
async function load(note){
  if (!state.dish || !state.pos) return;
  const my = ++state.req; state.busy = true;
  const cache = store.get('res-cache') || {}, ck = cacheKey(), hit = cache[ck];
  if (hit && Date.now() - hit.at < 6*3600*1000) { state.busy = false; state.src = hit.src; setPlaces(hit.places, note); return; }
  setStatus(''); $('r-name').textContent = `正在找附近的「${state.dish.n}」…`; $('result').classList.add('idle');
  let got = null, src = '', gErr = '';
  if (KEY) { try {
      got = await google(state.dish.n); src = 'google';
      const near = got.filter(o => dist(state.pos, o) <= state.radius * 1.25).length;
      if (near < 3 && state.dish.q && state.dish.q !== state.dish.n && my === state.req) {
        const more = await google(state.dish.q), ids = new Set(got.map(o => o.id));
        more.forEach(o => { if (!ids.has(o.id)) got.push(o); });
      }
    } catch (e) { gErr = e.status === 429 ? '今天的查询次数用完了' : e.status === 403 || e.status === 400 ? '密钥无效或服务没开启' : (e.name === 'AbortError' ? '连接超时' : e.message); } }
  if (my !== state.req) return;
  if (!got) { try { got = await photonSearch(state.dish.q); src = 'osm'; } catch (e) {} }
  if (my !== state.req) return;
  state.busy = false;
  if (!got) { state.places = []; empty('查不到附近的店', '地图服务暂时连不上，过一会儿再试。'); return; }
  const shaped = got.map(o => Object.assign(o, {d:dist(state.pos, o)})).filter(o => o.d <= Math.max(state.radius*1.25, 600)).sort((a,b) => a.d - b.d);
  state.src = src;
  const keep = {}; Object.keys(cache).forEach(k => { if (Date.now() - cache[k].at < 6*3600*1000) keep[k] = cache[k]; });
  keep[ck] = {at:Date.now(), places:shaped, src}; store.set('res-cache', keep);
  if (gErr) note = (note ? note + ' ' : '') + `Google 资料载入失败（${gErr}），先用免费地图资料，结果会比较少。`;
  setPlaces(shaped, note);
}
function setPlaces(arr, note){
  state.places = arr; state.seen = []; chips('cond'); footer();
  setStatus(note || ''); whereLine(); pick();
}

/* ---------- pick & show ---------- */
const pool = () => state.places.filter(p => [...state.conds].every(k => COND[k].f(p)));
const mapsSearch = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.n, p.street].filter(Boolean).join(' '));
const dishIcon = () => (state.dish && I[state.dish.i]) ? state.dish.i : '饭';
function pick(){
  list();
  const c = pool();
  if (!c.length) {
    if (state.places.length) empty('没有符合条件的店', '少选一个条件，或把范围调大。');
    else if (state.dish) empty(`附近没找到「${state.dish.n}」`, '把范围调大，或再转一次轮盘。');
    return;
  }
  let fresh = c.filter(p => !state.seen.includes(p.id));
  if (!fresh.length) { state.seen = state.cur && c.length > 1 ? [state.cur.id] : []; fresh = c.filter(p => !state.seen.includes(p.id)); }
  // favour closer and better-rated shops, but keep it random
  const w = fresh.map(p => 1 / (1 + p.d/600) * (p.rating ? (p.rating/4) ** 2 : .8));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), win = fresh[0];
  for (let i = 0; i < fresh.length; i++) { r -= w[i]; if (r <= 0) { win = fresh[i]; break; } }
  state.seen.push(win.id); show(win);
}
function show(p){
  state.cur = p; $('result').classList.remove('idle');
  const box = $('photo');
  if (p.photo && KEY) {
    box.className = 'photo';
    const by = p.photo.by ? `<span class="credit">照片：${p.photo.by.uri ? `<a href="${esc(p.photo.by.uri)}" target="_blank" rel="noopener">${esc(p.photo.by.displayName)}</a>` : esc(p.photo.by.displayName)}</span>` : '';
    box.innerHTML = `<a class="ph-link" href="${esc(p.maps || mapsSearch(p))}" target="_blank" rel="noopener" aria-label="在 Google 地图看 ${esc(p.n)} 的更多照片"><img src="${photoUrl(p.photo, 800)}" alt="${esc(p.n)} 的照片"><span class="more">更多照片 ›</span></a>` + by;
    box.querySelector('img').onerror = () => { box.className = 'photo noimg'; box.innerHTML = icon(dishIcon()); };
  } else { box.className = 'photo noimg'; box.innerHTML = icon(dishIcon()); }
  $('eyebrow').textContent = `推荐这家「${state.dish ? state.dish.n : ''}」`;
  $('r-name').textContent = p.n;
  $('r-dish').textContent = [p.kind, p.street].filter(Boolean).join(' · ');
  const t = [`<span class="tag dark">${fmtD(p.d)}</span>`, `<span class="tag">走路约 ${Math.max(1, Math.round(p.d/75))} 分钟</span>`];
  if (p.rating != null) t.push(`<span class="tag">★ ${p.rating.toFixed(1)}${p.rc ? `（${p.rc}）` : ''}</span>`);
  if (p.price != null) t.push(`<span class="tag">${PRICE[p.price]}</span>`);
  if (p.open === true) t.push('<span class="tag on">营业中</span>'); else if (p.open === false) t.push('<span class="tag off">休息中</span>');
  $('r-meta').innerHTML = t.join('');
  $('r-hours').innerHTML = p.hrs && p.hrs.length ? `<details><summary>营业时间</summary><ul>${p.hrs.map(h => `<li>${esc(h)}</li>`).join('')}</ul></details>` : '';
  $('menu').href = p.maps || mapsSearch(p);
  $('nav').href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
  document.querySelectorAll('#list li').forEach(li => li.style.background = li.dataset.id === p.id ? 'var(--sand)' : '');
}
function empty(title, sub){
  state.cur = null; $('result').classList.add('idle');
  $('photo').className = 'photo noimg'; $('photo').innerHTML = icon(dishIcon());
  $('eyebrow').textContent = '推荐这家'; $('r-name').textContent = title; $('r-dish').textContent = sub || '';
  $('r-meta').innerHTML = ''; $('r-hours').innerHTML = '';
  $('nav').removeAttribute('href'); $('menu').removeAttribute('href');
}
function resetResult(){
  state.places = []; state.seen = []; chips('cond'); list(); setStatus('');
  $('s2-sub').textContent = '转到之后，这里会推荐附近的店'; $('list-title').textContent = '附近的店';
  empty('先转轮盘', ''); whereLine();
}
function list(){
  const ok = new Set(pool().map(p => p.id));
  $('count').textContent = state.places.length ? `${ok.size} / ${state.places.length} 家` : '';
  let arr = state.places.slice();
  if (state.sort === 'rating') arr.sort((a,b) => (b.rating || 0) - (a.rating || 0) || a.d - b.d);
  arr.sort((a,b) => ok.has(b.id) - ok.has(a.id));
  $('list').innerHTML = arr.map(p => {
    const sub = [p.rating != null ? '★' + p.rating.toFixed(1) : '', p.price != null ? PRICE[p.price] : '', p.open === true ? '营业中' : p.open === false ? '休息中' : '', p.street].filter(Boolean).join('　·　');
    return `<li class="${ok.has(p.id) ? '' : 'off'}" data-id="${esc(p.id)}">
      <button type="button" class="pickme" style="all:unset;cursor:pointer;display:block"><strong>${esc(p.n)}</strong><small>${esc(sub)}</small></button>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">${fmtD(p.d)}</a></li>`;
  }).join('');
}
function footer(){
  $('foot').innerHTML = state.src === 'osm'
    ? '这次的结果来自 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 贡献者</a>，比较不全。'
    : '店家资料、照片和评分来自 Google 地图。';
}

/* ---------- wheel editing ---------- */
function renderEdit(){
  $('edit-occ').textContent = OCC[state.occ];
  $('edit-list').innerHTML = getItems(state.occ).map((it, i) => `<span>${esc(it.n)}<button type="button" data-del="${i}" aria-label="删除 ${esc(it.n)}">×</button></span>`).join('');
}
$('edit-list').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b || spinning) return;
  const list = getItems(state.occ); if (list.length <= 2) { b.blur(); return; }
  list.splice(Number(b.dataset.del), 1); setItems(state.occ, list);
  state.dish = null; state.dishIdx = -1; renderEdit(); drawWheel();
});
function addItem(){
  const v = $('edit-in').value.trim(); if (!v || spinning) return;
  const list = getItems(state.occ); if (list.some(it => it.n === v)) { $('edit-in').value = ''; return; }
  list.push({n:v, q:v, i:'饭'}); setItems(state.occ, list); $('edit-in').value = '';
  state.dishIdx = -1; renderEdit(); drawWheel();
}
$('edit-addbtn').addEventListener('click', addItem);
$('edit-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
$('edit-reset').addEventListener('click', () => { if (spinning) return; store.del(itemsKey(state.occ)); state.dishIdx = -1; renderEdit(); drawWheel(); });

/* ---------- events ---------- */
$('spin').addEventListener('click', spin);
$('next').addEventListener('click', () => { if (state.places.length) pick(); else spin(); });
$('relocate').addEventListener('click', () => locate(false));
$('manual-go').addEventListener('click', manual);
$('place').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); manual(); } });
$('list').addEventListener('click', e => {
  const b = e.target.closest('.pickme'); if (!b) return;
  const p = state.places.find(x => x.id === b.closest('li').dataset.id);
  show(p); $('result').scrollIntoView({block:'center', behavior:'smooth'});
});
document.addEventListener('visibilitychange', () => { if (KEY && document.visibilityState === 'visible' && navigator.geolocation) locate(true); });

function boot(){
  state.dishIdx = -1;
  chips('occ'); chips('radius'); chips('sort'); chips('cond'); renderEdit(); drawWheel(); resetResult(); footer();
  locate(false);
}

/* ---------- passcode lock ---------- */
const VAULT = {"s": "H1OKS72lYJBWvpQd58pDUA==", "i": "Oe2vGZ1s+DSVSkje", "c": "pkHYJzVfdFLbpwFNS31kqhSQPBJv6WSFZIqPmBRwUwR63kw/ve+kzLapSrHyWjYxwCmvucPxBw==", "n": 250000};
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(VAULT.s), iterations:VAULT.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.i)}, k, b64(VAULT.c));
  return new TextDecoder().decode(out);
}
$('lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('lock-pw').value.trim(); if (!pw) { $('lock-pw').focus(); return; }
  $('lock-go').disabled = true; $('lock-msg').textContent = '正在解锁…';
  try {
    KEY = await unlock(pw); store.set('gkey', KEY);
    $('lock').hidden = true; $('lock-pw').value = ''; $('lock-msg').textContent = '';
    boot();
  } catch (err) {
    $('lock-msg').textContent = window.crypto && crypto.subtle ? '通行码不对，再试一次。' : '这个浏览器不支持解锁，请用 Chrome 或 Safari 打开。';
  }
  $('lock-go').disabled = false;
});
$('relock').addEventListener('click', () => { KEY = ''; store.del('gkey'); store.del('res-cache'); location.reload(); });
if (KEY) boot(); else { $('lock').hidden = false; drawWheel(); setTimeout(() => $('lock-pw').focus(), 50); }
</script>
