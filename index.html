<meta name="mobile-web-app-capable" content="yes">

<title>附近今天吃什么</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: one calm paper column; a single accent colour is reserved for the pick and the main button. */
:root{
  color-scheme: light;
  --paper:#f7f0df; --card:#fffaf0; --sand:#f0dfb8;
  --ink:#0f3d4a; --muted:#5b777d; --line:rgba(15,61,74,.18);
  --accent:#e8553a;
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.scene{display:block;width:calc(100% + 32px);margin:0 -16px;height:auto;max-width:none}
@media (min-width:512px){.scene{width:100%;margin:16px 0 0}}

.head{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:0;letter-spacing:2px}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1.5px solid var(--ink);padding:9px 11px;font:inherit;background:var(--card);color:var(--ink);border-radius:0}
.search input::placeholder{color:var(--muted)}
.search button{border:1.5px solid var(--ink);background:var(--ink);color:var(--card);font-weight:700;padding:0 14px;white-space:nowrap}
.search .gps{background:none;color:var(--ink);padding:0 11px;display:flex;align-items:center;gap:4px}
.search .gps svg{width:16px;height:16px}
.loc{margin:0;font-size:13px;color:var(--muted);min-width:0}
.loc b{color:var(--ink);font-weight:700;margin-right:6px}

.result{background:var(--card);border:1.5px solid var(--ink);display:flex;flex-direction:column}
.photo{position:relative;background:var(--ink);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo.noimg{aspect-ratio:auto;height:120px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ico{width:120px}
.photo .ico svg{width:100%;height:auto;display:block}
.ph-link{display:block;width:100%;height:100%;position:relative}
.more{position:absolute;left:8px;top:8px;background:rgba(15,61,74,.8);color:#fffaf0;font-size:12px;font-weight:700;padding:3px 9px}
.credit{position:absolute;right:0;bottom:0;background:rgba(15,61,74,.75);color:#fffaf0;font-size:10.5px;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:inherit}
.thumbs{display:flex;gap:4px;padding:4px 4px 0}
.thumbs:empty{display:none}
.thumbs button{flex:0 0 72px;height:54px;border:0;padding:0;background:var(--sand);overflow:hidden;opacity:.6}
.thumbs button[aria-pressed="true"]{opacity:1;outline:2px solid var(--accent);outline-offset:-2px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pick{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.pick h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.dish{font-size:14px;margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:1px 8px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tag.on{border-color:#2f7d4f;color:#2f7d4f}
.tag.off{border-color:var(--accent);color:var(--accent)}
.hours{font-size:12.5px;margin:0;color:var(--muted)}
.hours details summary{cursor:pointer;list-style:none;text-decoration:underline;text-underline-offset:3px}
.hours details summary::-webkit-details-marker{display:none}
.hours ul{margin:4px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.spinning h2{color:var(--accent)}
.gone{align-self:flex-start;border:0;background:none;padding:2px 0 0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.gone[hidden]{display:none}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions > *{border:1.5px solid var(--ink);background:none;padding:10px 6px;text-align:center;text-decoration:none;font-weight:700;font-size:14px;display:block}
.actions > a:not([href]){opacity:.35;pointer-events:none}
.actions > .go{grid-column:1 / -1;background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:3px;padding:12px 8px}
.go:active{transform:translateY(1px)}
.status{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.status:empty{display:none}

.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:baseline}
.row[hidden]{display:none}
.row > span{flex:0 0 2.6em;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;padding:2px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:500}

details.fold{border-top:1px solid var(--line)}
details.fold.first{border-top:1.5px solid var(--ink)}
details.fold.last{border-bottom:1.5px solid var(--ink)}
.fold + .fold{margin-top:-16px}
.fold > summary{cursor:pointer;padding:12px 0;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"展开";font-size:12.5px;font-weight:400;color:var(--muted)}
.fold[open] > summary::after{content:"收起"}
.fold > summary span{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px;margin-right:auto}
.hint{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.sortbar{display:flex;gap:6px;align-items:baseline;margin:0 0 6px;font-size:12.5px;color:var(--muted)}
ol{list-style:none;margin:0 0 8px;padding:0}
li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 6px;border-top:1px solid var(--line)}
li strong{display:block;font-size:14px;line-height:1.35;font-weight:500;overflow-wrap:anywhere}
li small{display:block;font-size:12px;color:var(--muted)}
li a{font-size:12.5px;white-space:nowrap;color:var(--muted)}
li.off{opacity:.4}
.keybox{display:flex;flex-direction:column;gap:8px;padding:0 0 14px;font-size:13px}
.keybox p{margin:0;color:var(--muted)}
.keybox ol{list-style:decimal;padding-left:20px;margin:0;color:var(--muted)}
.keybox ol li{display:list-item;border:0;padding:0}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0;border:1px solid var(--line);padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.keyrow button{border:1.5px solid var(--ink);background:none;font-weight:700;padding:6px 12px}
.lock{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.lock[hidden]{display:none}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lockbox p{margin:0;color:var(--muted);font-size:14px}
.lockbox form{display:flex;gap:6px}
.lockbox input{flex:1;min-width:0;border:1.5px solid var(--ink);padding:10px 12px;font:inherit;background:var(--card);color:var(--ink);border-radius:0}
.lockbox button{border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;padding:0 18px}
.lockbox .lockmsg{color:var(--accent);min-height:1.4em}
.foot{font-size:11.5px;color:var(--muted);margin:0}
@media (max-width:380px){h1{font-size:34px}.pick h2{font-size:24px}.actions > *{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.photo .ico svg{transition:transform .25s}.spinning .photo .ico svg{transform:rotate(-8deg) scale(.94)}}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>

    <p>这个页面需要通行码才能使用。</p>
    <form id="lock-form" autocomplete="off">
      <input id="lock-pw" type="password" placeholder="输入通行码" aria-label="通行码" autocomplete="current-password">
      <button type="submit" id="lock-go">解锁</button>

    <p class="lockmsg" id="lock-msg" aria-live="polite"></p>
  </div>
</div>

<header class="head">
  <h1>今天吃什么</h1>
  <div class="search">
    <input id="place" type="search" enterkeyhint="search" placeholder="输入地点，例如 Sri Petaling" aria-label="输入地点">
    <button type="button" id="manual-go">找附近</button>
    <button type="button" class="gps" id="relocate" aria-label="用我现在的位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>定位</button>
  </div>
  <p class="loc"><b id="where">正在定位…</b><span id="where2">请在浏览器弹窗里允许使用位置</span></p>
</header>

<section class="result" id="result" aria-live="polite">
  <div class="photo noimg" id="photo"></div>
  <div class="thumbs" id="thumbs"></div>
  <div class="pick">
    <div class="eyebrow">这一餐去</div>
    <h2 id="r-name">—</h2>
    <p class="dish" id="r-dish"></p>
    <div class="meta" id="r-meta"></div>
    <div class="hours" id="r-hours"></div>
    <button type="button" class="gone" id="gone">这家倒了，以后别再抽</button>
  </div>
</section>

<div class="actions">
  <button class="go" id="go" type="button">再抽一家</button>
  <button class="nope" id="nope" type="button">不想吃这家</button>
  <a id="menu" target="_blank" rel="noopener">菜单·照片</a>
  <a id="nav" target="_blank" rel="noopener">带我去</a>
</div>
<p class="status" id="status"></p>

<section class="filters" aria-label="筛选">
  <div class="row"><span>范围</span><div class="chips" id="f-radius"></div></div>
  <div class="row"><span>想吃</span><div class="chips" id="f-cat"></div></div>
  <div class="row"><span>条件</span><div class="chips" id="f-cond"></div></div>
</section>

<details class="fold first">
  <summary>附近的店<span id="count"></span></summary>
  <div class="sortbar">排序 <div class="chips" id="f-sort"></div></div>
  <p class="hint">点店名直接选它，点距离打开导航。</p>
  <p class="hint" id="closed-note"></p>
  <ol id="list"></ol>
</details>
<details class="fold last" id="keyfold">
  <summary>这台设备<span id="keystate">已解锁</span></summary>
  <div class="keybox">
    <p>这台设备已用通行码解锁，会显示 Google 地图的照片、评分和营业状态。不想让这台设备继续使用，可以锁回去，下次打开需要重新输入通行码。</p>
    <div class="keyrow"><button type="button" id="relock">锁上这台设备</button></div>
  </div>
</details>

<p class="foot" id="foot"></p>
</main>

function catOf(code, name){
  const c = (code || '').toLowerCase(), n = name || '';
  for (const k of ORDER) if (CATS[k].re.test(c)) return k;
  if (/seafood|ikan|海鲜|steam ?fish|蒸鱼/i.test(n)) return '海鲜';
  if (/mamak|nasi kandar|maju|naan|roti|banana leaf/i.test(n)) return '印度·嘛嘛';
  if (/[一-鿿]/.test(n) || /kopitiam|kedai kopi|kedai makanan|dim sum|bak kut|wantan|wan tan|pan mee|chicken rice/i.test(n)) return '中餐';
  if (/warung|nasi|ayam|selera|masakan|kampung|tomyam|tom yam/i.test(n)) return '马来';
  if (/mcdonald|kfc|burger|pizza|subway|texas|marrybrown|domino|a&w|4fingers/i.test(n)) return '西餐·快餐';
  if (/coffee|cafe|café|kopi|tea|zus|starbucks|tealive|chagee|bakery|dessert/i.test(n)) return '咖啡·甜点';

function dist(a, b){
  const R = 6371000, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lon-a.lon)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD = m => m < 950 ? Math.round(m/10)*10 + ' 米' : (m/1000).toFixed(1) + ' 公里';
function tfetch(url, opt, ms){

}

const F = {
  radius:[[500,'500 米'],[1000,'1 公里'],[2000,'2 公里'],[5000,'5 公里']],
  cat:[['','随便']].concat(Object.keys(CATS).map(k => [k,k])),
  sort:[['near','最近'],['rating','评分高'],['random','随机']]

function chips(key){
  if (key === 'cond') {
    const avail = Object.keys(COND).filter(k => state.places.some(COND[k].has));
    [...state.conds].forEach(k => { if (!avail.includes(k)) state.conds.delete(k); });
    $('f-cond').closest('.row').hidden = !avail.length;
    $('f-cond').innerHTML = avail.map(k => `<button type="button" class="chip" data-k="cond" data-v="${k}" aria-pressed="${state.conds.has(k)}">${COND[k].l}</button>`).join('');
    return;
  }
  let opts = F[key];
  if (key === 'sort' && !state.places.some(p => p.rating != null)) opts = opts.filter(o => o[0] !== 'rating');
  $('f-'+key).innerHTML = opts.map(([v,l]) => `<button type="button" class="chip" data-k="${key}" data-v="${v}" aria-pressed="${String(state[key])===String(v)}">${l}</button>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k, v = b.dataset.v;
  if (k === 'radius') { state.radius = Number(v); chips('radius'); if (state.pos) load(); return; }
  if (k === 'cat') { state.cat = v; chips('cat'); }
  if (k === 'cond') { state.conds.has(v) ? state.conds.delete(v) : state.conds.add(v); chips('cond'); }

});

/* ---------- location ---------- */
function setWhere(a, b){ $('where').textContent = a; $('where2').textContent = b || ''; }
function locate(auto){
  if (!navigator.geolocation) { setWhere('这个浏览器不支持定位', '在上面输入地点也可以'); return; }
  if (!auto) setWhere('正在定位…', '如果浏览器弹出询问，请点允许');
  const lid = ++state.lid; let done = false;
  if (!auto) setTimeout(() => { if (!done && lid === state.lid) { done = true; setWhere('定位没有回应', framed ? '预览窗口不允许定位，请在浏览器里打开' : '浏览器没有给出位置，在上面输入地点也可以'); $('place').focus(); } }, 15000);
  navigator.geolocation.getCurrentPosition(p => {
    if (done || lid !== state.lid) return; done = true;
    const np = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
    if (auto && state.pos && dist(state.pos, np) < 250) return;
    const moved = auto && state.pos;
    state.pos = np; state.label = ''; $('place').value = '';
    load(moved ? '你换地方了，已按新位置更新。' : '');
  }, err => {
    if (auto || done || lid !== state.lid) return; done = true;
    setWhere(err.code === 1 ? '没有拿到定位权限' : '定位失败', framed ? '预览窗口不允许定位，请在浏览器里打开' : err.code === 1 ? '在浏览器的网站设置里允许位置，或在上面输入地点' : '检查设备的定位服务是否打开，或在上面输入地点');
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:auto ? 60000 : 0});
}
async function manual(){
  const q = $('place').value.trim();
  if (!q) { $('place').focus(); return; }
  state.lid++; setWhere('正在找这个地方…', q); $('place').blur();
  let hit = null;
  try {
    const j = await (await tfetch('https://photon.komoot.io/api/?limit=1&lat=3.1&lon=101.7&q=' + encodeURIComponent(q), {}, 10000)).json();
    const f = (j.features || [])[0]; if (f) hit = {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]};
  } catch (e) {}
  if (!hit) try {
    const j = await (await tfetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh,en&q=' + encodeURIComponent(q), {}, 10000)).json();
    if (j.length) hit = {lat:+j[0].lat, lon:+j[0].lon};
  } catch (e) {}
  if (!hit) { setWhere('找不到这个地点', '换个写法，或加上城市名再试'); return; }
  state.pos = hit; state.label = q; load();
}
async function nameArea(){
  if (state.label) return whereLine();
  const {lat, lon} = state.pos;
  try {
    const p = ((await (await tfetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}`, {}, 8000)).json()).features || [])[0]?.properties || {};
    state.label = [p.district || p.locality || p.street, p.city].filter(Boolean).join(' · ');
  } catch (e) {
    try { const a = (await (await tfetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=zh,en&lat=${lat}&lon=${lon}`, {}, 8000)).json()).address || {};
      state.label = [a.neighbourhood || a.suburb || a.village || a.road, a.city || a.town].filter(Boolean).join(' · '); } catch (e2) {}
  }
  whereLine();
}
function whereLine(){
  if (!state.pos || state.busy) return;
  const acc = state.pos.acc ? `，定位误差约 ${Math.round(state.pos.acc)} 米` : '';
  setWhere(state.label || `${state.pos.lat.toFixed(4)}, ${state.pos.lon.toFixed(4)}`, `${fmtD(state.radius)}内找到 ${state.places.length} 家${acc}`);
}

/* ---------- data: Google Places (optional) ---------- */
const GMASK = ['id','displayName','location','rating','userRatingCount','priceLevel','currentOpeningHours.openNow','currentOpeningHours.weekdayDescriptions','regularOpeningHours.weekdayDescriptions','photos','primaryType','primaryTypeDisplayName','googleMapsUri','websiteUri','businessStatus','shortFormattedAddress','servesVegetarianFood','servesBreakfast','takeout','delivery'].map(f => 'places.' + f).join(',');
async function gNearby(types, rank){
  const {lat, lon} = state.pos;
  const r = await tfetch('https://places.googleapis.com/v1/places:searchNearby', {method:'POST', headers:{'Content-Type':'application/json','X-Goog-Api-Key':KEY,'X-Goog-FieldMask':GMASK},
    body:JSON.stringify({includedTypes:types, maxResultCount:20, rankPreference:rank, languageCode:'zh-CN', regionCode:'MY', locationRestriction:{circle:{center:{latitude:lat, longitude:lon}, radius:state.radius}}})}, 15000);
  if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error((j.error && j.error.message) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return (await r.json()).places || [];
}
async function google(){
  const lists = await Promise.all([gNearby(['restaurant'], 'DISTANCE'), gNearby(['restaurant'], 'POPULARITY'), gNearby(['cafe','coffee_shop','bakery','dessert_shop','fast_food_restaurant','food_court'], 'DISTANCE')]);
  const seen = new Set(), out = [];
  lists.flat().forEach(g => {
    if (!g || seen.has(g.id) || !g.location) return; seen.add(g.id);
    if (g.businessStatus && g.businessStatus !== 'OPERATIONAL') return;
    const name = (g.displayName && g.displayName.text) || '';
    const hrs = (g.currentOpeningHours && g.currentOpeningHours.weekdayDescriptions) || (g.regularOpeningHours && g.regularOpeningHours.weekdayDescriptions) || null;
    out.push({ id:'g' + g.id, n:name, lat:g.location.latitude, lon:g.location.longitude,
      c:catOf(g.primaryType, name), kind:(g.primaryTypeDisplayName && g.primaryTypeDisplayName.text) || '', cu:'', street:g.shortFormattedAddress || '',
      rating:g.rating, rc:g.userRatingCount, price:PRICE_KEY[g.priceLevel], open:g.currentOpeningHours ? g.currentOpeningHours.openNow : undefined, hrs,
      photos:(g.photos || []).slice(0, 1).map(p => ({name:p.name, by:(p.authorAttributions || [])[0] || null})),
      maps:g.googleMapsUri, web:g.websiteUri, veg:g.servesVegetarianFood, bfast:g.servesBreakfast,
      halal:/halal|nasi kandar|mamak/i.test(name) || /halal/.test(g.primaryType || '') ? true : undefined });
  });

}
const photoUrl = (p, w) => `https://places.googleapis.com/v1/${p.name}/media?maxWidthPx=${w || 800}&key=${encodeURIComponent(KEY)}`;

/* ---------- data: OpenStreetMap (free) ---------- */
async function photon(){
  const {lat, lon} = state.pos, km = Math.max(0.3, state.radius/1000);
  const lists = await Promise.all(Object.keys(KIND).map(k =>
    tfetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&radius=${km}&limit=50&osm_tag=amenity:${k}`, {}, 12000)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })));
  const seen = new Set(), out = [];
  lists.forEach(j => (j.features || []).forEach(f => {
    const p = f.properties || {}, id = (p.osm_type || 'x').toLowerCase() + p.osm_id;
    if (!p.name || seen.has(id)) return; seen.add(id);
    const [lo, la] = f.geometry.coordinates;
    out.push({id, n:p.name, lat:la, lon:lo, c:catOf(p.osm_value === 'cafe' ? 'cafe' : p.osm_value === 'fast_food' ? 'fast_food' : '', p.name), kind:KIND[p.osm_value], cu:'',
      street:[p.housenumber, p.street].filter(Boolean).join(' ') || p.district || ''});
  }));
  return out.filter(p => dist(state.pos, p) <= state.radius * 1.05);
}
async function overpassPlaces(ms){
  const {lat, lon} = state.pos;
  const q = `[out:json][timeout:20];(nwr["amenity"~"^(restaurant|cafe|fast_food|food_court)$"]["name"](around:${state.radius},${lat},${lon}););out tags center 300;`;
  const r = await tfetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}}, ms);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).elements.map(e => {
    const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon, t = e.tags || {};
    if (la == null) return null;
    const cu = t.cuisine || '';
    return { id:e.type[0] + e.id, n:t['name:zh'] && t['name:zh'] !== t.name ? `${t.name}（${t['name:zh']}）` : t.name, lat:la, lon:lo,
      c:catOf(cu || (t.amenity === 'cafe' ? 'cafe' : t.amenity === 'fast_food' ? 'fast_food' : ''), t.name), kind:KIND[t.amenity],
      cu:cu.replace(/_/g,' ').split(';').slice(0,3).join('、'), h:t.opening_hours || '',
      halal:t['diet:halal'] === 'yes' || t['diet:halal'] === 'only' ? true : undefined, veg:t['diet:vegetarian'] === 'yes' || t['diet:vegetarian'] === 'only' ? true : undefined,
      web:t.website || t['contact:website'] || '', menuUrl:t['website:menu'] || t.menu || '', street:[t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' ') };
  }).filter(Boolean);
}
const nkey = p => p.n.toLowerCase().replace(/[^a-z0-9一-鿿]/g, '');

/* ---------- load ---------- */
async function load(note){
  const my = ++state.req; state.busy = true;
  setWhere('正在找附近的店…', ''); nameArea();
  const shape = o => Object.assign(o, {d:dist(state.pos, {lat:o.lat, lon:o.lon})});
  let got = null, src = '', err = '', gErr = '';
  if (KEY) {
    try { got = await google(); src = 'google'; } catch (e) { gErr = e.status === 403 || e.status === 400 ? '密钥无效或没有开启 Places API (New)' : (e.name === 'AbortError' ? '连接超时' : e.message); }
    if (my !== state.req) return;
  }
  if (!got) {
    try { got = await photon(); src = 'osm'; } catch (e) { err = e && e.name; }
    if (my !== state.req) return;
  }
  if (!got) {
    try { got = await overpassPlaces(15000); src = 'osm'; } catch (e) { err = e && e.name; }
    if (my !== state.req) return;
  }
  state.busy = false;
  if (!got) {
    state.places = []; chips('cond'); draw(true);
    setWhere('查不到附近的店', framed ? '预览窗口挡住了联网，请在浏览器里打开' : '地图服务暂时连不上（' + (err === 'AbortError' ? '超时' : '网络错误') + '），点「定位」再试');
    return;
  }
  state.src = src;
  if (gErr) note = (note ? note + ' ' : '') + 'Google 资料载入失败（' + gErr + '），先用免费地图资料。';
  setPlaces(got.map(shape), note); whereLine(); footer();
  if (src === 'osm') overpassPlaces(9000).then(more => {
    if (my !== state.req || !more.length) return;
    const byKey = new Map(state.places.map(p => [nkey(p), p]));
    more.forEach(m => { const old = byKey.get(nkey(m));
      if (old) { ['cu','h','halal','veg','web','menuUrl'].forEach(f => { if (!old[f] && m[f]) old[f] = m[f]; }); if (old.c === '其他') old.c = m.c; if (!old.street) old.street = m.street; }
      else { state.places.push(shape(m)); byKey.set(nkey(m), m); } });
    state.places.sort((a,b) => a.d - b.d); cache(); chips('cond'); list(); if (state.cur) show(state.cur); whereLine();
  }).catch(() => {});
}
function cache(){ store.set('near-cache', {pos:state.pos, radius:state.radius, places:state.places, label:state.label, src:state.src, key:!!KEY, at:Date.now()}); }
function setPlaces(arr, note){
  state.places = arr.sort((a,b) => a.d - b.d); cache();
  state.seen = []; state.note = note || ''; chips('cond'); chips('sort'); draw(true);
}

/* ---------- pick ---------- */
const pool = () => state.places.filter(p => !isClosed(p) && (!state.cat || p.c === state.cat) && [...state.conds].every(k => COND[k].f(p)) && !state.skip.has(p.id));
const mapsSearch = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.n, p.street, state.label].filter(Boolean).join(' '));
function showPhoto(p, i){
  state.ph = i;
  const ph = p.photos && p.photos[i], box = $('photo');
  if (!ph || !KEY) { box.className = 'photo noimg'; box.innerHTML = icon(CATS[p.c].i); return; }
  box.className = 'photo';
  const by = ph.by ? `<span class="credit">照片：${ph.by.uri ? `<a href="${esc(ph.by.uri)}" target="_blank" rel="noopener">${esc(ph.by.displayName)}</a>` : esc(ph.by.displayName)}</span>` : '';
  const link = p.maps || mapsSearch(p);
  box.innerHTML = `<a class="ph-link" href="${esc(link)}" target="_blank" rel="noopener" aria-label="在 Google 地图看 ${esc(p.n)} 的更多照片"><img src="${photoUrl(ph, 800)}" alt="${esc(p.n)} 的照片" loading="eager"><span class="more">更多照片 ›</span></a>` + by;
  box.querySelector('img').onerror = () => { box.className = 'photo noimg'; box.innerHTML = icon(CATS[p.c].i); };
  [...$('thumbs').children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
}
function show(p){
  state.cur = p; $('gone').hidden = state.src === 'google';
  const photos = KEY && p.photos ? p.photos : [];
  $('thumbs').innerHTML = false ? photos.map((ph, j) => `<button type="button" data-ph="${j}" aria-label="第 ${j+1} 张照片" aria-pressed="${j===0}"><img src="${photoUrl(ph, 800)}" alt="" loading="lazy"></button>`).join('') : '';
  showPhoto(p, 0);
  $('r-name').textContent = p.n;
  $('r-dish').textContent = [p.kind, p.cu || p.street].filter(Boolean).join(' · ');
  const t = [`<span class="tag dark">${fmtD(p.d)}</span>`, `<span class="tag">走路约 ${Math.max(1, Math.round(p.d/75))} 分钟</span>`];
  if (p.rating != null) t.push(`<span class="tag">★ ${p.rating.toFixed(1)}${p.rc ? `（${p.rc}）` : ''}</span>`);
  if (p.price != null) t.push(`<span class="tag">${PRICE[p.price]}</span>`);
  if (p.open === true) t.push('<span class="tag on">营业中</span>'); else if (p.open === false) t.push('<span class="tag off">休息中</span>');
  t.push(`<span class="tag">${esc(p.c)}</span>`);
  if (p.halal) t.push('<span class="tag">清真</span>');
  if (p.veg) t.push('<span class="tag">有素食</span>');
  $('r-meta').innerHTML = t.join('');
  $('r-hours').innerHTML = p.hrs && p.hrs.length ? `<details><summary>营业时间</summary><ul>${p.hrs.map(h => `<li>${esc(h)}</li>`).join('')}</ul></details>`
    : p.h ? '营业：' + esc(p.h) : '地图资料里没有营业时间';
  $('menu').href = p.menuUrl || p.maps || mapsSearch(p);
  $('menu').title = p.menuUrl ? '打开店家的菜单' : '在 Google 地图看菜单、照片和评价';
  $('nav').href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
  document.querySelectorAll('#list li').forEach(li => li.style.background = li.dataset.id === p.id ? 'var(--sand)' : '');
}
function empty(){
  state.cur = null; $('thumbs').innerHTML = '';
  $('photo').className = 'photo noimg'; $('photo').innerHTML = icon('饭');
  const filtered = state.places.length > 0;
  $('r-name').textContent = filtered ? '没有符合条件的店' : (state.pos ? '附近没找到店' : '等你的位置');
  $('r-dish').textContent = filtered ? '少选一个条件、换个类型，或把范围调大。' : state.pos ? '把范围调大再试试。' : '允许定位，或在上面输入地点。';
  $('r-meta').innerHTML = ''; $('r-hours').innerHTML = ''; $('gone').hidden = true;
  $('nav').removeAttribute('href'); $('menu').removeAttribute('href');
}
let timer = null;
function draw(instant){
  clearInterval(timer); $('result').classList.remove('spinning');
  const c = pool(); list();
  if (!c.length) { empty(); return; }
  let fresh = c.filter(p => !state.seen.includes(p.id));
  if (!fresh.length) { state.seen = state.cur && c.length > 1 ? [state.cur.id] : []; fresh = c.filter(p => !state.seen.includes(p.id)); }
  const win = fresh[Math.floor(Math.random()*fresh.length)]; state.seen.push(win.id);
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches || c.length < 2) { show(win); return; }
  const box = $('result'); box.classList.add('spinning'); let i = 0;
  $('photo').className = 'photo noimg'; $('thumbs').innerHTML = '';
  timer = setInterval(() => { const r = c[Math.floor(Math.random()*c.length)]; $('r-name').textContent = r.n; $('photo').innerHTML = icon(CATS[r.c].i);
    if (++i > 12) { clearInterval(timer); box.classList.remove('spinning'); show(win); } }, 70);
}
function list(){
  const ok = new Set(pool().map(p => p.id));
  const hid = state.places.filter(isClosed).length;
  $('count').textContent = state.places.length ? `${ok.size} / ${state.places.length - hid} 家` : '';
  $('closed-note').innerHTML = closed.size ? `你标记了 ${closed.size} 家倒闭的店，${hid ? `这附近有 ${hid} 家已隐藏。` : ''}<button type="button" id="closed-reset" style="all:unset;cursor:pointer;text-decoration:underline;font-weight:700">全部恢复</button>` : '';
  let arr = state.places.filter(p => !isClosed(p));
  if (state.sort === 'rating') arr.sort((a,b) => (b.rating || 0) - (a.rating || 0) || a.d - b.d);
  if (state.sort === 'random') arr.sort(() => Math.random() - .5);
  arr.sort((a,b) => ok.has(b.id) - ok.has(a.id));
  $('list').innerHTML = arr.slice(0, 150).map(p => {
    const sub = [p.c, p.rating != null ? '★' + p.rating.toFixed(1) : '', p.price != null ? PRICE[p.price] : '', p.open === true ? '营业中' : p.open === false ? '休息中' : '', p.cu, state.skip.has(p.id) ? '今天已排除' : ''].filter(Boolean).join('　·　');
    return `<li class="${ok.has(p.id) ? '' : 'off'}" data-id="${esc(p.id)}">
      <button type="button" class="pickme" style="all:unset;cursor:pointer;display:block"><strong>${esc(p.n)}</strong><small>${esc(sub)}</small></button>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">${fmtD(p.d)}</a></li>`;
  }).join('');
  const n = state.skip.size;
  $('status').innerHTML = (lastClosed ? `已把「${esc(lastClosed.n)}」标为倒闭，以后不会再抽到。<button type="button" id="undo-closed" style="all:unset;cursor:pointer;text-decoration:underline;font-weight:700">撤销</button> ` : '') + (state.note ? esc(state.note) + ' ' : '') + (n ? `今天排除了 ${n} 家。<button type="button" id="reset" style="all:unset;cursor:pointer;text-decoration:underline;font-weight:700">全部恢复</button>` : '');
  state.note = '';
}
function footer(){
  $('foot').innerHTML = state.src === 'google'
    ? '店家资料、照片和评分来自 Google 地图。'
    : '店家资料来自 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 贡献者</a>（经 Photon 和 Overpass 查询），小档口和新店可能没收录。「菜单·照片」会打开 Google 地图搜索这家店。';
  $('keystate').textContent = state.src === 'google' ? '已解锁' : '已解锁（Google 资料暂时载入失败）';
}

/* ---------- events ---------- */
$('go').addEventListener('click', () => { lastClosed = null; draw(false); });
$('nope').addEventListener('click', () => { if (state.cur) { state.skip.add(state.cur.id); saveSkip(); } draw(false); });
$('relocate').addEventListener('click', () => locate(false));
$('manual-go').addEventListener('click', manual);
$('place').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); manual(); } });
$('thumbs').addEventListener('click', e => { const b = e.target.closest('[data-ph]'); if (b && state.cur) showPhoto(state.cur, Number(b.dataset.ph)); });
$('status').addEventListener('click', e => {
  if (e.target.id === 'reset') { state.skip.clear(); saveSkip(); draw(true); }
  if (e.target.id === 'undo-closed' && lastClosed) { closed.delete(ckey(lastClosed)); saveClosed(); const p = lastClosed; lastClosed = null; list(); show(p); chips('cond'); }
});
$('gone').addEventListener('click', () => { const p = state.cur; if (!p) return; closed.add(ckey(p)); saveClosed(); lastClosed = p; draw(false); });
$('closed-note').addEventListener('click', e => { if (e.target.id === 'closed-reset') { closed.clear(); saveClosed(); lastClosed = null; draw(true); } });
$('list').addEventListener('click', e => {
  const b = e.target.closest('.pickme'); if (!b) return;
  const p = state.places.find(x => x.id === b.closest('li').dataset.id);
  clearInterval(timer); $('result').classList.remove('spinning');
  if (state.skip.delete(p.id)) saveSkip();
  list(); show(p); $('result').scrollIntoView({block:'center', behavior:'smooth'});
});
document.addEventListener('visibilitychange', () => { if (KEY && document.visibilityState === 'visible' && navigator.geolocation) locate(true); });

function boot(){
chips('radius'); chips('cat'); chips('sort'); footer();
const cached = store.get('near-cache');
if (cached && Date.now() - cached.at < 6*3600*1000 && cached.key === !!KEY) {
  Object.assign(state, {pos:cached.pos, radius:cached.radius, places:cached.places, label:cached.label, src:cached.src});
  chips('radius'); chips('cond'); chips('sort'); draw(true); whereLine(); footer(); locate(true);
} else { chips('cond'); empty(); list(); locate(false); }
}
const VAULT = {"s": "H1OKS72lYJBWvpQd58pDUA==", "i": "Oe2vGZ1s+DSVSkje", "c": "pkHYJzVfdFLbpwFNS31kqhSQPBJv6WSFZIqPmBRwUwR63kw/ve+kzLapSrHyWjYxwCmvucPxBw==", "n": 250000};
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(VAULT.s), iterations:VAULT.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.i)}, k, b64(VAULT.c));
  return new TextDecoder().decode(out);
}
$('lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('lock-pw').value.trim(); if (!pw) { $('lock-pw').focus(); return; }
  $('lock-go').disabled = true; $('lock-msg').textContent = '正在解锁…';
  try {
    KEY = await unlock(pw); store.set('gkey', KEY);
    $('lock').hidden = true; $('lock-pw').value = ''; $('lock-msg').textContent = '';
    boot();
  } catch (err) {
    $('lock-msg').textContent = window.crypto && crypto.subtle ? '通行码不对，再试一次。' : '这个浏览器不支持解锁，请用 Chrome 或 Safari 打开。';
  }
  $('lock-go').disabled = false;
});
$('relock').addEventListener('click', () => { KEY = ''; store.del('gkey'); store.del('near-cache'); location.reload(); });
if (KEY) boot(); else { $('lock').hidden = false; setTimeout(() => $('lock-pw').focus(), 50); }
</script>
